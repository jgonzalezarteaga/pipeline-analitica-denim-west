name: Tiendanube Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  extract-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Google Cloud credentials file
        run: echo '${{ secrets.GCP_CREDENTIALS_JSON }}' > gcp-credentials.json

      - name: Run the script
        env:
          TIENDANUBE_ACCESS_TOKEN: ${{ secrets.TIENDANUBE_ACCESS_TOKEN }}
          TIENDANUBE_STORE_ID: ${{ secrets.TIENDANUBE_STORE_ID }}
        run: python scripts/tiendanube_extraction.py