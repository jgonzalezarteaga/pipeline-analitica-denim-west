name: Google Ads Extraction via GA4

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:

jobs:
  extract-google-ads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Google Cloud credentials file
        run: echo '${{ secrets.GCP_CREDENTIALS_JSON }}' > gcp-credentials.json

      - name: Run the script
        run: python scripts/google_ads_ga4_extraction.py